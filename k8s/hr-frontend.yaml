apiVersion: apps/v1
kind: Deployment
metadata:
  name: hr-frontend
  namespace: hr-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hr-frontend
  template:
    metadata:
      labels:
        app: hr-frontend
    spec:
      containers:
        - name: hr-frontend
          image: 123456789012.dkr.ecr.ap-northeast-2.amazonaws.com/hr-frontend:latest
          ports:
            - containerPort: 80
          # Frontend config usually baked in, but we can mount config.js if needed
---
apiVersion: v1
kind: Service
metadata:
  name: hr-frontend
  namespace: hr-system
spec:
  selector:
    app: hr-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
