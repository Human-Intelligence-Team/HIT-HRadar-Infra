apiVersion: apps/v1
kind: Deployment
metadata:
  name: hr-chatbot
  namespace: hr-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hr-chatbot
  template:
    metadata:
      labels:
        app: hr-chatbot
    spec:
      containers:
        - name: hr-chatbot
          image: 850995576970.dkr.ecr.ap-northeast-2.amazonaws.com/hradar-chatbot:b99467721a97280d48ea50c74c918c41b0e5fad1
          ports:
            - containerPort: 8000
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: hr-common-config
                  key: KAFKA_BROKERS
          envFrom:
            - configMapRef:
                name: hr-common-config
            - secretRef:
                name: hr-secrets
#          livenessProbe:
#            httpGet:
#              path: /health
#              port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: hr-chatbot
  namespace: hr-system
spec:
  type: NodePort
  selector:
    app: hr-chatbot
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8000
    - name: https
      protocol: TCP
      port: 443
      targetPort: 8000
